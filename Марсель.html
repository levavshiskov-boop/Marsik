<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Марсель</title>
<style>
:root{--bg:#15171d;--ink:#f3ead9;--mute:#a79f90;--lamp:#f0c878;--card:#1e2129;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6efe2;--ink:#2a2620;--mute:#7a7164;--lamp:#c77d1a;--card:#fffaf0}}
:root[data-theme="dark"]{--bg:#15171d;--ink:#f3ead9;--mute:#a79f90;--lamp:#f0c878;--card:#1e2129}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:28px 20px 48px;text-align:center}
.photo{position:relative;border-radius:50% 50% 46% 46%/38% 38% 62% 62%;overflow:hidden;aspect-ratio:4/5;box-shadow:0 0 0 6px var(--card),0 20px 60px rgba(240,200,120,.18);cursor:pointer;border:0;padding:0;width:100%;display:block;background:var(--card)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:55% 45%;display:block;transition:transform .4s}
.photo.on img{transform:scale(1.05)}
h1{font-size:clamp(3rem,16vw,5rem);margin:28px 0 0;letter-spacing:-.02em;line-height:1;font-weight:700}
.sub{color:var(--mute);margin:8px 0 28px;font-style:italic;font-size:1.1rem}
.btn{font:inherit;font-size:1.15rem;background:var(--lamp);color:#1a1408;border:0;border-radius:999px;padding:16px 34px;cursor:pointer;display:inline-flex;gap:12px;align-items:center;position:relative}
.btn:focus-visible,.photo:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.btn.on::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid var(--lamp);animation:p 1s ease-out infinite}
@keyframes p{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.btn.on::after{animation:none}.photo img{transition:none}}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.bars i{width:4px;background:#1a1408;border-radius:2px;height:6px}
.btn.on .bars i{animation:b .5s ease-in-out infinite alternate}
.btn.on .bars i:nth-child(2){animation-delay:.15s}.btn.on .bars i:nth-child(3){animation-delay:.3s}
@keyframes b{to{height:18px}}
.count{margin-top:22px;color:var(--mute);font-size:.95rem}
.count b{color:var(--ink)}
</style></head><body><main>

var a=document.getElementById('a'),btn=document.getElementById('btn'),ph=document.getElementById('ph'),lbl=document.getElementById('lbl'),n=document.getElementById('n');
var c=0;try{c=parseInt(localStorage.getItem('marsel_c')||'0',10)||0}catch(e){}
n.textContent=c;
function set(on){btn.classList.toggle('on',on);ph.classList.toggle('on',on);lbl.textContent=on?'Марсель говорит…':'Послушать голос'}
function play(){a.currentTime=0;a.play().then(function(){c++;n.textContent=c;try{localStorage.setItem('marsel_c',c)}catch(e){}}).catch(function(){})}
btn.onclick=ph.onclick=function(){if(a.paused)play();else{a.pause();set(false)}};
a.onplay=function(){set(true)};a.onended=a.onpause=function(){set(false)};
</script></body></html>
